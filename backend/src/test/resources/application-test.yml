# 单元测试专用 Profile 配置 (application-test.yml)
# 仅在 Maven test 阶段激活，隔离开发与生产环境配置
server:
  port: 0

spring:
  application:
    name: college-internship-backend-test
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:internship_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      auto-commit: true
      connection-timeout: 10000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.college.internship.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 测试专用 Mock 密钥 (明确标示为 TEST ONLY)
security:
  jwt:
    secret-key: mock-test-only-jwt-secret-key-for-unit-testing-32-chars-long
    expiration-seconds: 3600
    token-prefix: "Bearer "
    header-string: "Authorization"

upload:
  base-path: "target/test-uploads/"
  max-size-mb: 5

# 阶段6 实习周报与过程指导参数配置 (测试环境)
internship:
  weekly:
    min-content-length: 15
    min-return-reason-length: 10
    min-review-comment-length: 10
    min-guidance-length: 15
    min-feedback-length: 5
    max-export-rows: 5000
    max-export-days: 365
    export-rate-limit-seconds: 10
    guidance-voucher-max-size-mb: 10
    min-task-duration-days: 0
    system-timezone: "Asia/Shanghai"

